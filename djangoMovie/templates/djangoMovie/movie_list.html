<!DOCTYPE html>
<html>
<head>
    <title>CineWebLibrary</title>
    <style>
        body { 
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f4f4f9;
            color: #333;
        }
        h1 { 
            color: #2c3e50; 
        }
        form { 
            margin-bottom: 20px; 
        }
        input, button { 
            padding: 8px;
            font-size: 14px; 
        }
        table { 
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 15px; 
        }
        th, td { padding: 12px;
            border: 1px solid #ddd;
            text-align: left; 
        }
        th { 
            background: #2c3e50;
            color: white; 
        }
        a.button { 
            background: #3498db;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 15px; 
        }
    </style>
</head>
<body>
    <h1>🎬 CineWebLibrary</h1>
    <a href="{% url 'add_movie' %}" class="button">Add New Movie</a>

    <form method="GET" action="">
        <input type="text" name="q" placeholder="Search title, director, genre..." value="{{ query }}">
        <button type="submit">Search</button>
        {% if query %}
            <a href="{% url 'movie_list' %}">Clear</a>
        {% endif %}
    </form>

    <table>
        <tr>
            <th>Title</th>
            <th>Director</th>
            <th>Genre</th>
            <th>Release Year</th>
            <th>Rating</th>
        </tr>
        {% for movie in movies %}
        <tr>
            <td>{{ movie.title }}</td>
            <td>{{ movie.director }}</td>
            <td>{{ movie.genre }}</td>
            <td>{{ movie.release_year }}</td>
            <td>{{ movie.rating }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">No movies found in your collection.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
