<!DOCTYPE html>
<html>
<head>
    <title>Add Movie - CineWebLibrary</title>
    <style>
        body { 
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f4f4f9; 
        }
        form { 
            background: white;
            padding: 20px;
            max-width: 400px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
        div { 
            margin-bottom: 15px; 
        }
        label { 
            display: block;
            margin-bottom: 5px;
            font-weight: bold; 
        }
        input { 
            width: 100%;
            padding: 8px;
            box-sizing: border-box; 
        }
        button { 
            background: #27ae60;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            border-radius: 4px; 
        }
        a { 
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: #3498db; 
        }
    </style>
</head>
<body>
    <h1>Add a New Movie</h1>
    <form method="POST">
        {% csrf_token %}
        <div>
            <label>Movie Title:</label>
            <input type="text" name="title" required>
        </div>
        <div>
            <label>Director:</label>
            <input type="text" name="director" required>
        </div>
        <div>
            <label>Genre:</label>
            <input type="text" name="genre" required>
        </div>
        <div>
            <label>Release Year:</label>
            <input type="number" name="release_year" required>
        </div>
        <div>
            <label>Rating (e.g., PG-13, R):</label>
            <input type="text" name="rating" required>
        </div>
        <button type="submit">Save Movie</button>
    </form>
    <a href="{% url 'movie_list' %}">← Back to Movie List</a>
</body>
</html>
